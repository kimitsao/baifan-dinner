<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晚餐邀請</title>
    <style>
        /* 設定網頁背景與字體 */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #fff0f5; /* 浪漫的淡粉紅色背景 */
            font-family: 'Microsoft JhengHei', sans-serif;
            overflow: hidden; /* 防止按鈕跑出版面產生捲軸 */
        }

        h1 {
            color: #d63384;
            margin-bottom: 40px;
            text-align: center;
        }

        /* 按鈕容器 */
        .button-container {
            position: relative;
            width: 300px;
            height: 50px;
            display: flex;
            justify-content: center;
            gap: 20px; /* 兩個按鈕的間距 */
        }

        /* 按鈕的方塊設計 */
        button {
            width: 100px;
            height: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 5px; /* 微微的圓角讓方塊更好看 */
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            transition: background-color 0.3s;
        }

        /* 答應按鈕的樣式 */
        #yes-btn {
            background-color: #4CAF50;
            color: white;
        }

        #yes-btn:hover {
            background-color: #45a049;
        }

        /* 拒絕按鈕的樣式 */
        #no-btn {
            background-color: #f44336;
            color: white;
            transition: left 0.2s ease, top 0.2s ease; /* 讓按鈕移動時有一點滑順感 */
        }
    </style>
</head>
<body>

    <!-- 這裡的文字已經為你修改囉！ -->
    <h1>請問親愛的白飯，今晚要一起共進晚餐嗎？</h1>
    
    <div class="button-container">
        <button id="yes-btn">好啊！</button>
        <button id="no-btn">不要</button>
    </div>

    <script>
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');

        // 當點擊「好啊！」時的反應
        yesBtn.addEventListener('click', () => {
            alert('太棒了！那我們晚上見囉！🎉');
        });

        // 當滑鼠移動到「不要」按鈕上時，按鈕會飄走
        noBtn.addEventListener('mouseover', () => {
            // 將按鈕的定位改為 fixed，這樣它才能在整個視窗內自由移動
            noBtn.style.position = 'fixed';
            
            // 計算視窗的寬度與高度，並扣除按鈕本身的大小，避免按鈕跑出視窗外
            const maxX = window.innerWidth - noBtn.offsetWidth;
            const maxY = window.innerHeight - noBtn.offsetHeight;
            
            // 產生隨機的 X 與 Y 座標
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            // 將新的座標套用到按鈕上
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        });
    </script>

</body>
</html>
